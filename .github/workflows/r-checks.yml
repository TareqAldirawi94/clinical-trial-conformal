name: R checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Run tests and one trial
        run: Rscript tests/run_tests.R
      - name: Smoke test repeated simulation
        run: Rscript scripts/run_operating_characteristics.R 20
      - name: Check conformal calibration and data separation
        run: Rscript tests/test_conformal.R
      - name: Run individual prediction comparison
        run: Rscript scripts/run_conformal_prediction.R
      - name: Smoke test repeated conformal simulation
        run: Rscript scripts/run_conformal_repeated.R 3
      - name: Check four-cell Mondrian prediction
        run: Rscript tests/test_mondrian.R
      - name: Smoke test Mondrian repeated comparison
        run: Rscript scripts/run_mondrian_repeated.R 3
      - name: Check adverse-event CRC
        run: Rscript tests/test_crc.R
      - name: Smoke test repeated CRC
        run: Rscript scripts/run_crc_repeated.R 3
